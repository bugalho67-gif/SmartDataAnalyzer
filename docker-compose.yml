version: "3.9"

services:

  smart-data-analyzer:

    build: .

    container_name: smart-data-analyzer

    restart: unless-stopped

    ports:
      - "8501:8501"

    volumes:
      - ./exports:/app/exports
      - ./logs:/app/logs

    environment:
      - PYTHONUNBUFFERED=1

    stdin_open: true

    tty: true
